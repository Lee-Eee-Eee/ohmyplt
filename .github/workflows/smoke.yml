name: skill-and-figure-smoke
on: [push, pull_request]
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and test fonts
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-liberation
      - name: Compile helpers
        run: python -m compileall -q scripts examples
      - name: Render component examples
        run: |
          python scripts/doctor.py --body-font 'Liberation Sans' --math-font 'Liberation Serif'
          python examples/network.py --out output --body-font 'Liberation Sans' --math-font 'Liberation Serif'
          python examples/data_plot.py --out output --body-font 'Liberation Sans' --math-font 'Liberation Serif'
      - name: Audit rendered PDFs
        run: |
          python scripts/preflight.py output/network.pdf --out output/qa/network
          python scripts/preflight.py output/data-plot.pdf --out output/qa/data-plot
      - name: Audit geometry helpers
        run: python vendor/nature_figure/audit_figure_collisions.py --self-test
